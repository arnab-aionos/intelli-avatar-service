<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliAvatar - Conversational AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .avatar-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-display {
            width: 100%;
            max-width: 512px;
            height: 400px;
            margin: 0 auto;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .avatar-display canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .avatar-placeholder {
            text-align: center;
            color: #64748b;
        }

        .avatar-placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            font-size: 0.95rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-indicator.connected { background: #10b981; }
        .status-indicator.listening { background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
        .status-indicator.processing { background: #3b82f6; animation: pulse 0.8s ease-in-out infinite; }
        .status-indicator.speaking { background: #8b5cf6; animation: pulse 0.6s ease-in-out infinite; }
        .status-indicator.error { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .config-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .config-panel h3 {
            margin-bottom: 15px;
            font-size: 1rem;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e4e4e7;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e4e4e7;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2rem;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn.listening {
            background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
            animation: pulse-ring 1.5s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .transcript-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 250px;
            overflow-y: auto;
        }

        .transcript-panel h3 {
            margin-bottom: 15px;
            font-size: 1rem;
            color: #94a3b8;
        }

        .message {
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message.user {
            background: rgba(79, 172, 254, 0.15);
            border-left: 3px solid #4facfe;
        }

        .message.assistant {
            background: rgba(139, 92, 246, 0.15);
            border-left: 3px solid #8b5cf6;
        }

        .interim-text {
            color: #94a3b8;
            font-style: italic;
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .hidden { display: none !important; }
        
        .speech-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: #fbbf24;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 IntelliAvatar</h1>
            <p>Real-time Conversational AI Avatar</p>
        </header>

        <div class="avatar-container">
            <div class="avatar-display" id="avatar-display">
                <div class="avatar-placeholder" id="avatar-placeholder">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <p>Avatar will appear here</p>
                </div>
                <canvas id="avatar-canvas" class="hidden"></canvas>
            </div>
            
            <div class="status-bar">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="status-text">Click Connect to start</span>
            </div>
        </div>

        <div class="controls">
            <div id="speech-warning" class="speech-warning hidden">
                ⚠️ Your browser may not fully support speech recognition. Use Chrome for best results.
            </div>
            
            <div class="config-panel">
                <h3>⚙️ Configuration</h3>
                <div class="form-group">
                    <label for="api-url">WebSocket URL</label>
                    <input type="text" id="api-url" placeholder="ws://localhost:8001/ws/avatar">
                </div>
                <div class="form-group">
                    <label for="system-prompt">System Prompt (Avatar Personality)</label>
                    <textarea id="system-prompt">You are a friendly and helpful AI assistant. Be conversational and engaging. Keep responses concise - 2-3 sentences max.</textarea>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="connect-btn" onclick="toggleConnection()">
                    🔌 Connect
                </button>
                <button class="btn btn-primary mic-btn hidden" id="mic-btn" onclick="toggleListening()">
                    🎤
                </button>
            </div>

            <div class="transcript-panel">
                <h3>💬 Conversation</h3>
                <div id="interim-text" class="interim-text hidden"></div>
                <div id="transcript"></div>
            </div>
        </div>
    </div>

    <script>
        // State
        let websocket = null;
        let recognition = null;
        let isListening = false;
        let currentAudio = null;
        
        // DOM Elements
        const connectBtn = document.getElementById('connect-btn');
        const micBtn = document.getElementById('mic-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const transcript = document.getElementById('transcript');
        const interimText = document.getElementById('interim-text');
        const apiUrlInput = document.getElementById('api-url');
        const systemPromptInput = document.getElementById('system-prompt');
        const speechWarning = document.getElementById('speech-warning');

        // Check for speech recognition support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            speechWarning.classList.remove('hidden');
            speechWarning.textContent = '❌ Speech recognition not supported in this browser. Please use Chrome.';
        }

        // Set default API URL based on current location
        function getDefaultWsUrl() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname || 'localhost';
            
            // Default to port 8001 for local dev
            if (host === 'localhost' || host === '127.0.0.1') {
                return `${protocol}//${host}:8001/ws/avatar`;
            }
            
            // For production, use same origin
            const basePath = window.location.pathname.replace(/\/[^/]*\.html$/, '');
            if (basePath && basePath !== '/') {
                return `${protocol}//${host}${basePath}/ws/avatar`;
            }
            
            return `${protocol}//${host}/ws/avatar`;
        }
        
        apiUrlInput.value = getDefaultWsUrl();

        function updateStatus(status, message) {
            statusIndicator.className = 'status-indicator ' + status;
            statusText.textContent = message;
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = text;
            transcript.insertBefore(div, transcript.firstChild);
        }

        async function toggleConnection() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                disconnect();
            } else {
                await connect();
            }
        }

        async function connect() {
            const url = apiUrlInput.value || getDefaultWsUrl();
            
            try {
                updateStatus('processing', 'Connecting...');
                
                websocket = new WebSocket(url);
                
                websocket.onopen = () => {
                    console.log('WebSocket connected');
                    updateStatus('connected', 'Connected - Click 🎤 to speak');
                    connectBtn.textContent = '🔌 Disconnect';
                    connectBtn.classList.remove('btn-primary');
                    connectBtn.classList.add('btn-danger');
                    micBtn.classList.remove('hidden');
                    
                    // Send configuration
                    websocket.send(JSON.stringify({
                        type: 'config',
                        system_prompt: systemPromptInput.value
                    }));
                    
                    // Initialize speech recognition
                    initSpeechRecognition();
                };
                
                websocket.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    handleServerMessage(message);
                };
                
                websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    updateStatus('error', 'Connection error');
                };
                
                websocket.onclose = () => {
                    console.log('WebSocket closed');
                    disconnect();
                };
                
            } catch (error) {
                console.error('Connection failed:', error);
                updateStatus('error', 'Failed to connect');
            }
        }

        function disconnect() {
            if (recognition) {
                recognition.stop();
            }
            if (websocket) {
                websocket.close();
                websocket = null;
            }
            
            isListening = false;
            updateStatus('', 'Disconnected');
            connectBtn.textContent = '🔌 Connect';
            connectBtn.classList.add('btn-primary');
            connectBtn.classList.remove('btn-danger');
            micBtn.classList.add('hidden');
            micBtn.classList.remove('listening');
            interimText.classList.add('hidden');
        }

        function initSpeechRecognition() {
            if (!SpeechRecognition) return;
            
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const result = event.results[i];
                    if (result.isFinal) {
                        finalTranscript += result[0].transcript;
                    } else {
                        interimTranscript += result[0].transcript;
                    }
                }
                
                // Show interim results
                if (interimTranscript) {
                    interimText.textContent = '🎤 ' + interimTranscript;
                    interimText.classList.remove('hidden');
                }
                
                // Send final results to server
                if (finalTranscript) {
                    interimText.classList.add('hidden');
                    sendTextToServer(finalTranscript.trim());
                }
            };
            
            recognition.onend = () => {
                if (isListening) {
                    // Restart if still listening
                    recognition.start();
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'not-allowed') {
                    updateStatus('error', 'Microphone access denied');
                }
            };
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) {
                updateStatus('error', 'Speech recognition not available');
                return;
            }
            
            // Stop any playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            isListening = true;
            micBtn.classList.add('listening');
            updateStatus('listening', 'Listening... Speak now');
            
            try {
                recognition.start();
            } catch (e) {
                // Already started
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            updateStatus('connected', 'Connected - Click 🎤 to speak');
            interimText.classList.add('hidden');
            
            if (recognition) {
                recognition.stop();
            }
        }

        function sendTextToServer(text) {
            if (!text || !websocket || websocket.readyState !== WebSocket.OPEN) return;
            
            console.log('Sending text:', text);
            stopListening();
            
            websocket.send(JSON.stringify({
                type: 'text_input',
                text: text
            }));
        }

        function handleServerMessage(message) {
            console.log('Server:', message);
            
            switch (message.type) {
                case 'connected':
                    console.log('Session ID:', message.session_id);
                    break;
                    
                case 'processing':
                    const statusMap = {
                        'thinking': 'AI is thinking...',
                        'generating_speech': 'Generating speech...',
                        'generating_avatar': 'Generating avatar...'
                    };
                    updateStatus('processing', statusMap[message.status] || message.status);
                    break;
                    
                case 'user_text':
                    addMessage('user', message.text);
                    break;
                    
                case 'response_text':
                    addMessage('assistant', message.text);
                    break;
                    
                case 'audio_response':
                    playAudio(message.data);
                    updateStatus('speaking', 'Speaking...');
                    break;
                    
                case 'video_frame':
                    displayFrame(message.data);
                    break;
                    
                case 'response_complete':
                    updateStatus('connected', 'Connected - Click 🎤 to speak');
                    break;
                    
                case 'error':
                    updateStatus('error', message.message);
                    setTimeout(() => {
                        updateStatus('connected', 'Connected - Click 🎤 to speak');
                    }, 3000);
                    break;
            }
        }

        function playAudio(base64Data) {
            console.log('Received audio data, length:', base64Data.length);
            
            try {
                const audioData = base64ToArrayBuffer(base64Data);
                console.log('Decoded audio bytes:', audioData.byteLength);
                
                // Edge TTS outputs MP3
                const blob = new Blob([audioData], { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                
                currentAudio = new Audio(url);
                currentAudio.volume = 1.0;
                
                currentAudio.onloadeddata = () => {
                    console.log('Audio loaded, duration:', currentAudio.duration);
                };
                
                currentAudio.onended = () => {
                    console.log('Audio playback finished');
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    updateStatus('connected', 'Connected - Click 🎤 to speak');
                };
                
                currentAudio.onerror = (e) => {
                    console.error('Audio error:', e, currentAudio.error);
                    updateStatus('error', 'Audio playback failed: ' + (currentAudio.error?.message || 'unknown error'));
                };
                
                // Play the audio
                const playPromise = currentAudio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        console.log('Audio playback started');
                    }).catch(e => {
                        console.error('Audio playback blocked:', e);
                        updateStatus('error', 'Click anywhere to enable audio');
                        // Try to play on next user interaction
                        document.addEventListener('click', () => {
                            if (currentAudio) currentAudio.play();
                        }, { once: true });
                    });
                }
            } catch (e) {
                console.error('Audio processing error:', e);
                updateStatus('error', 'Failed to process audio');
            }
        }

        function displayFrame(base64Data) {
            const avatarPlaceholder = document.getElementById('avatar-placeholder');
            const avatarCanvas = document.getElementById('avatar-canvas');
            
            avatarPlaceholder.classList.add('hidden');
            avatarCanvas.classList.remove('hidden');
            
            const img = new Image();
            img.onload = () => {
                const ctx = avatarCanvas.getContext('2d');
                avatarCanvas.width = img.width;
                avatarCanvas.height = img.height;
                ctx.drawImage(img, 0, 0);
            };
            img.src = 'data:image/jpeg;base64,' + base64Data;
        }

        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }
    </script>
</body>
</html>
